<!DOCTYPE html>
<html>
	<head>
		<title>Page Title</title>
		<link rel="stylesheet" href="styles.css">
		<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
	</head>

	<body>

	

		Username
		<input id='Username' type='text'>
		Password
		<input id='Password' type='text'>
		Fullname
		<input id='Fullname' type='text'>
		<button type="button" onclick="clickButton( document.getElementById('Username').value ,document.getElementById('Password').value ,document.getElementById('Fullname').value"</button>
		<button type="button" onclick="document.location.href = "indexShipping.html";">Login</button>

		<script>


		const user = 'qwer';
		const pass = '1234'


		const clickButton = (a,b,c) =>{

			const postData = {
				Username:a,
				Password:b,
				Fullname:c

			};

			const data = {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json'
				},
				body: JSON.stringify(postData)
			}
	
			async function fetchData() {
				try {
					const response = await fetch('http://127.0.0.1:8000/ApplicantSchool',data);
					console.log(response)
					if (response.data.status =='success') {
						document.location.href = 'profile.html.html';
					} else {
						throw new Error('Failed to fetch data');
					}
				} catch (error) {
					console.error('Error:', error); 
				}
			}

			fetchData()
	
		}

		</script>
	</body>
</html>
